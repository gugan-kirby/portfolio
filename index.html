<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thalapathigugan K · Full Stack & AI Developer</title>
<meta name="description" content="Portfolio of Thalapathigugan K (Gugan), Full Stack & AI Developer.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23141413%27/%3E%3Ctext x=%2732%27 y=%2742%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2728%27 fill=%27%23f2efe8%27 text-anchor=%27middle%27%3ETK%3C/text%3E%3Ccircle cx=%2750%27 cy=%2740%27 r=%274%27 fill=%27%23e5481c%27/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #141413; overflow: hidden; }
  iframe { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<iframe id="site" title="Portfolio"></iframe>
<noscript><p style="color:#f2efe8;font-family:sans-serif;padding:24px">
  Pick a style: <a href="clean/">Clean</a> · <a href="anime/">Anime</a> · <a href="shonen/">Shonen</a>
</p></noscript>
<script>
  // Each refresh shows a different style than the last visit.
  var styles = ['clean', 'anime', 'shonen'];
  var last = null;
  try { last = localStorage.getItem('portfolio-style'); } catch (e) {}
  var choices = styles.filter(function (s) { return s !== last; });
  var pick = choices[Math.floor(Math.random() * choices.length)];
  try { localStorage.setItem('portfolio-style', pick); } catch (e) {}

  var frame = document.getElementById('site');
  frame.src = pick + '/';
  frame.addEventListener('load', function () {
    try { document.title = frame.contentDocument.title; } catch (e) {}
  });
</script>
</body>
</html>
